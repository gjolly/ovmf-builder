name: Build Intel TDX OVMF

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "edk2 git digest (commit SHA, branch, or tag)"
        required: true
        type: string
      version:
        description: "Release version/tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm bison flex git python3

      - name: Checkout edk2
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: ${{ inputs.digest }}
          submodules: recursive

      - name: Build Intel TDX OVMF (Secure Boot disabled)
        shell: bash
        run: |
          source edksetup.sh
          # edksetup.sh may skip building the C-based BaseTools (VfrCompile,
          # GenFw, ...) on a re-setup; build them explicitly.
          make -C BaseTools -j"$(nproc)"
          # tools_def v3.06+ removed the GCC5 tag in favor of GCC; pick
          # whichever the checked-out digest defines.
          if grep -qE '^\*_GCC5_X64_' Conf/tools_def.txt; then
            TOOLCHAIN=GCC5
          elif grep -qE '^\*_GCC_X64_' Conf/tools_def.txt; then
            TOOLCHAIN=GCC
          else
            echo "No GCC toolchain family found in Conf/tools_def.txt" >&2
            exit 1
          fi
          echo "Using toolchain: $TOOLCHAIN"
          build -a X64 -t "$TOOLCHAIN" -b RELEASE \
            -p OvmfPkg/IntelTdx/IntelTdxX64.dsc \
            -D SECURE_BOOT_ENABLE=FALSE

      - name: Create release and attach OVMF.fd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FV_DIR=$(find Build -type d -name FV | head -1)
          if [ -z "$FV_DIR" ] || [ ! -f "$FV_DIR/OVMF.fd" ]; then
            echo "OVMF.fd not found under Build/" >&2
            exit 1
          fi
          gh release create "${{ inputs.version }}" \
            --title "Intel TDX OVMF ${{ inputs.version }}" \
            --notes "edk2 digest: $(git rev-parse HEAD)" \
            "$FV_DIR/OVMF.fd#OVMF.fd"
